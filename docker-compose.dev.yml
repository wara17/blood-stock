# Development Environment - Hot reload enabled
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blood-stock-db-dev
    environment:
      POSTGRES_DB: blood_stock_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - blood-stock-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: blood-stock-backend-dev
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blood_stock_dev
      DB_USER: dev_user
      DB_PASSWORD: dev_password
      DB_TYPE: postgresql
      JWT_SECRET: dev_secret_key_for_development_only
    ports:
      - "3002:3002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - blood-stock-dev
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: blood-stock-frontend-dev
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:3002
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - blood-stock-dev
    command: npm start

volumes:
  postgres_dev_data:

networks:
  blood-stock-dev:
    driver: bridge